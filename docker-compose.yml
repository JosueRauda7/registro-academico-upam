services:
  db:
    image: postgres:16-alpine
    container_name: upam_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: upam_academico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD en .env}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/init-app-role.sh:/docker-entrypoint-initdb.d/zz-app-role.sh:ro
      - ./database/security-role.sql:/opt/upam/security-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upam_backend
    restart: unless-stopped
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - uploads:/app/uploads
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: upam_academico
      DATABASE_USER: upam_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET en .env}
      NODE_ENV: production
      JWT_EXPIRATION: 24h
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
      WOMPI_BASE_URL: https://sandbox.wompi.co/v1
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-UPAM <no-reply@upam.edu.sv>}
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.0.151:8082}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upam_frontend
    restart: unless-stopped
    ports:
      - '0.0.0.0:8082:80'
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
