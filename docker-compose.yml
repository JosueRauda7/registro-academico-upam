services:
  db:
    image: postgres:16-alpine
    container_name: upam_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: upam_academico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upam_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: upam_academico
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: upam-secret-key-2026-academico
      JWT_EXPIRATION: 24h
      WOMPI_PUBLIC_KEY: pk_test_abc123
      WOMPI_PRIVATE_KEY: sk_test_abc123
      WOMPI_BASE_URL: https://sandbox.wompi.co/v1
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-UPAM <no-reply@upam.edu.sv>}
      FRONTEND_URL: http://localhost
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upam_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
